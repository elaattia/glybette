# Host-level Nginx site for Glybette production.
# Install: sudo cp deploy/nginx/glybette.conf /etc/nginx/sites-available/glybette
#          sudo ln -sf /etc/nginx/sites-available/glybette /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# TLS: use Certbot. Wildcard *.glybette.com requires DNS-01 (see deployment.md).

client_max_body_size 10m;

server {
    listen 80;
    server_name glybette.com www.glybette.com *.glybette.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name glybette.com www.glybette.com *.glybette.com;

    # Replace after Certbot issuance (paths vary by distro/plugin):
    # ssl_certificate /etc/letsencrypt/live/glybette.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/glybette.com/privkey.pem;

    # Frontend SPA (docker compose client service on host port 15173)
    location / {
        proxy_pass http://127.0.0.1:15173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API gateway
    location /api/ {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
