services:
    workspace-deps:
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm install --frozen-lockfile --config.confirmModulesPurge=false"
        environment:
            CI: "true"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store

    rabbitmq:
        image: rabbitmq:3.13-management
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 8

    api-gateway:
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm --filter \"@glybette/api-gateway\" dev"
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            NODE_ENV: development
            PORT_API_GATEWAY: 3000
            USERS_SERVICE_URL: http://users-service:3001
            SCRAPING_SERVICE_URL: http://scraping-service:3002
            EMAIL_SERVICE_URL: http://email-service:3003
            PORTFOLIO_SERVICE_URL: http://portfolio-service:3004
            PROJECTS_SERVICE_URL: http://projects-service:3008
            CV_SERVICE_URL: http://cv-service:3006
            AI_SERVICE_URL: http://ai-service:3007
            CHOKIDAR_USEPOLLING: "1"
            CHOKIDAR_INTERVAL: "300"
            WATCHPACK_POLLING: "true"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store
        depends_on:
            workspace-deps:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
            users-service:
                condition: service_started
            scraping-service:
                condition: service_started
            email-service:
                condition: service_started
            portfolio-service:
                condition: service_started
            projects-service:
                condition: service_started
            cv-service:
                condition: service_started
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 8

    client:
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm --filter \"@glybette/client\" exec vite --host 0.0.0.0 --port 5173"
        ports:
            - "5173:5173"
        env_file:
            - .env
        environment:
            VITE_API_PROXY_TARGET: http://api-gateway:3000
            CHOKIDAR_USEPOLLING: "1"
            CHOKIDAR_INTERVAL: "300"
            WATCHPACK_POLLING: "true"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store
        depends_on:
            workspace-deps:
                condition: service_completed_successfully
            api-gateway:
                condition: service_started
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 20s
            timeout: 5s
            retries: 8

    users-service:
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm --filter \"@glybette/users-service\" dev"
        ports:
            - "3001:3001"
        env_file:
            - .env
        environment:
            NODE_ENV: development
            PORT_USERS_SERVICE: 3001
            RABBITMQ_URL: amqp://rabbitmq:5672
            CHOKIDAR_USEPOLLING: "1"
            CHOKIDAR_INTERVAL: "300"
            WATCHPACK_POLLING: "true"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store
        depends_on:
            workspace-deps:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 8

    email-service:
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm --filter \"@glybette/email-service\" dev"
        ports:
            - "3003:3003"
        env_file:
            - .env
        environment:
            NODE_ENV: development
            PORT_EMAIL_SERVICE: 3003
            RABBITMQ_URL: amqp://rabbitmq:5672
            CHOKIDAR_USEPOLLING: "1"
            CHOKIDAR_INTERVAL: "300"
            WATCHPACK_POLLING: "true"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store
        depends_on:
            workspace-deps:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 8

    portfolio-service:
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm --filter \"@glybette/portfolio-service\" dev"
        ports:
            - "3004:3004"
        env_file:
            - .env
        environment:
            NODE_ENV: development
            PORT_PORTFOLIO_SERVICE: 3004
            CHOKIDAR_USEPOLLING: "1"
            CHOKIDAR_INTERVAL: "300"
            WATCHPACK_POLLING: "true"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store
        depends_on:
            workspace-deps:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 8

    scraping-service:
        build:
            context: .
            dockerfile: apps/scraping-service/Dockerfile.dev
        working_dir: /workspace/apps/scraping-service
        command: python main.py
        ports:
            - "3002:3002"
        env_file:
            - .env
        environment:
            HOST: 0.0.0.0
            PORT_SCRAPING_SERVICE: 3002
        volumes:
            - ./:/workspace
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:3002/health').status==200 else 1)",
                ]
            interval: 20s
            timeout: 5s
            retries: 8

    cv-service:
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm --filter \"@glybette/cv-service\" dev"
        ports:
            - "3006:3006"
        env_file:
            - .env
        environment:
            NODE_ENV: development
            PORT_CV_SERVICE: 3006
            AI_SERVICE_URL: http://ai-service:3007
            CHOKIDAR_USEPOLLING: "1"
            CHOKIDAR_INTERVAL: "300"
            WATCHPACK_POLLING: "true"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store
        depends_on:
            workspace-deps:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 8

    projects-service:
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm --filter \"@glybette/projects-service\" dev"
        ports:
            - "3008:3008"
        env_file:
            - .env
        environment:
            NODE_ENV: development
            PORT_PROJECTS_SERVICE: 3008
            PROJECTS_SERVICE_MONGODB_DB_NAME: glybette_projects
            UPLOAD_PROVIDER: disk
            PROJECTS_UPLOAD_DISK_DIR: /workspace/.data/projects-uploads
            PROJECTS_UPLOAD_PUBLIC_BASE_URL: /api/projects/media
            PROJECTS_UPLOAD_MAX_MB: 5
            USERS_SERVICE_URL: http://users-service:3001
            INTEROP_SYNC_TIMEOUT_MS: 7000
            CHOKIDAR_USEPOLLING: "1"
            CHOKIDAR_INTERVAL: "300"
            WATCHPACK_POLLING: "true"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store
        depends_on:
            workspace-deps:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 8

    ai-service:
        profiles: ["ai"]
        build:
            context: .
            dockerfile: Dockerfile.dev
        working_dir: /workspace
        command: bash -lc "pnpm --filter \"@glybette/ai-service\" dev"
        ports:
            - "3007:3007"
        env_file:
            - .env
        environment:
            NODE_ENV: development
            PORT_AI_SERVICE: 3007
            OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
            CHOKIDAR_USEPOLLING: "1"
            CHOKIDAR_INTERVAL: "300"
            WATCHPACK_POLLING: "true"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./:/workspace
            - node_modules:/workspace/node_modules
            - pnpm-store:/pnpm/store
        depends_on:
            workspace-deps:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 20s
            timeout: 5s
            retries: 8

volumes:
    node_modules:
    pnpm-store:
