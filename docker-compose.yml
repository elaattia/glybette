services:
    mongodb:
        image: mongo:7
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:3.13-management
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            - RABBITMQ_DEFAULT_USER=guest
            - RABBITMQ_DEFAULT_PASS=guest
        healthcheck:
            test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 8

    api-gateway:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: api-gateway
        ports:
            - "3000:3000"
        environment:
            - PORT=3000
            - NODE_ENV=production
            - USERS_SERVICE_URL=http://users-service:3001
            - SCRAPING_SERVICE_URL=http://scraping-service:3002
            - NOTIFICATIONS_SERVICE_URL=http://notifications-service:3003
            - PORTFOLIO_SERVICE_URL=http://portfolio-service:3004
            - AI_SERVICE_URL=http://ai-service:3007
            - CV_SERVICE_URL=http://cv-service:3006
            - JOBS_SERVICE_URL=http://jobs-service:3005
            - PROJECTS_SERVICE_URL=http://projects-service:3008
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            - rabbitmq
            - users-service
            - scraping-service
            - notifications-service
            - portfolio-service
            - cv-service
            - ai-service
            - jobs-service
            - projects-service

    users-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: users-service
        ports:
            - "3001:3001"
        environment:
            - PORT=3001
            - PORT_USERS_SERVICE=3001
            - NODE_ENV=production
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            - rabbitmq

    notifications-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: notifications-service
        ports:
            - "3003:3003"
        environment:
            - PORT=3003
            - PORT_NOTIFICATIONS_SERVICE=3003
            - NODE_ENV=production
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - PROJECTS_SERVICE_URL=http://projects-service:3008
            - USERS_SERVICE_URL=http://users-service:3001
            - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mock}
            - EMAIL_FROM=${EMAIL_FROM:-no-reply@glybette.dev}
            - RESEND_API_KEY=${RESEND_API_KEY:-}
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            - rabbitmq
            - projects-service

    portfolio-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: portfolio-service
        ports:
            - "3004:3004"
        environment:
            - PORT=3004
            - PORT_PORTFOLIO_SERVICE=3004
            - NODE_ENV=production
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            - rabbitmq

    projects-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: projects-service
        ports:
            - "3008:3008"
        environment:
            - PORT=3008
            - PORT_PROJECTS_SERVICE=3008
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - PROJECTS_SERVICE_MONGODB_DB_NAME=glybette_projects
            - UPLOAD_PROVIDER=disk
            - PROJECTS_UPLOAD_DISK_DIR=/app/.data/projects-uploads
            - PROJECTS_UPLOAD_PUBLIC_BASE_URL=/api/projects/media
            - PROJECTS_UPLOAD_MAX_MB=5
            - USERS_SERVICE_URL=http://users-service:3001
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - INTEROP_SYNC_TIMEOUT_MS=7000
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            mongodb:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            users-service:
                condition: service_started
        restart: unless-stopped

    scraping-service:
        build:
            context: .
            dockerfile: apps/scraping-service/Dockerfile
        ports:
            - "3002:3002"
        environment:
            - PORT=3002
            - PORT_SCRAPING_SERVICE=3002
            - NODE_ENV=production
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - MONGODB_URI=${MONGODB_URI}
            - SCRAPING_MONGODB_NAME=${SCRAPING_MONGODB_NAME}
            - SCRAPE_DELAY_MIN=${SCRAPE_DELAY_MIN}
            - SCRAPE_DELAY_MAX=${SCRAPE_DELAY_MAX}
            - SCHEDULE_INDEED=${SCHEDULE_INDEED}
            - SCHEDULE_WTTJ=${SCHEDULE_WTTJ}
            - SCHEDULE_LINKEDIN=${SCHEDULE_LINKEDIN}
            - SCHEDULE_PFEBOOKS=${SCHEDULE_PFEBOOKS}
            - ARCHIVE_AFTER_DAYS=${ARCHIVE_AFTER_DAYS}
            - SCRAPING_LOG_LEVEL=${SCRAPING_LOG_LEVEL}
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            mongodb:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped

    ai-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: ai-service
        ports:
            - "3007:3007"
        environment:
            - PORT=3007
            - PORT_AI_SERVICE=3007
            - NODE_ENV=production
            - AI_PROVIDER=${AI_PROVIDER}
            - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
            - OLLAMA_MODEL=${OLLAMA_MODEL}
            - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            - GEMINI_API_KEY=${GEMINI_API_KEY}
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            mongodb:
                condition: service_healthy
        restart: unless-stopped

    cv-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: cv-service
        ports:
            - "3006:3006"
        environment:
            - PORT=3006
            - PORT_CV_SERVICE=3006
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - AI_SERVICE_URL=http://ai-service:3007
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
        env_file:
            - .env
        depends_on:
            mongodb:
                condition: service_healthy
            ai-service:
                condition: service_started
        restart: unless-stopped

    jobs-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: jobs-service
        ports:
            - "3005:3005"
        environment:
            - PORT=3005
            - PORT_JOBS_SERVICE=3005
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - AI_SERVICE_URL=http://ai-service:3007
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            - USERS_SERVICE_URL=http://users-service:3001
        env_file:
            - .env
        depends_on:
            rabbitmq:
                condition: service_healthy
            mongodb:
                condition: service_healthy
            ai-service:
                condition: service_started
        restart: unless-stopped
volumes:
    mongodb_data:
    redis_data:
