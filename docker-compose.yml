services:
    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:3.13-management
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            - RABBITMQ_DEFAULT_USER=guest
            - RABBITMQ_DEFAULT_PASS=guest
        healthcheck:
            test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 8
        restart: unless-stopped

    client:
        build:
            context: .
            dockerfile: apps/client/Dockerfile
            args:
                VITE_PORTFOLIO_ROOT_DOMAIN: ${VITE_PORTFOLIO_ROOT_DOMAIN}
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        ports:
            - "5173:80"
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "wget", "-qO-", "http://localhost/" ]
            interval: 20s
            timeout: 5s
            retries: 8

    api-gateway:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: api-gateway
        ports:
            - "3000:3000"
        environment:
            - PORT=3000
            - NODE_ENV=production
            - USERS_SERVICE_URL=http://users-service:3001
            - SCRAPING_SERVICE_URL=http://scraping-service:3002
            - NOTIFICATIONS_SERVICE_URL=http://notifications-service:3003
            - PORTFOLIO_SERVICE_URL=http://portfolio-service:3004
            - AI_SERVICE_URL=http://ai-service:3007
            - CV_SERVICE_URL=http://cv-service:3006
            - JOBS_SERVICE_URL=http://jobs-service:3005
            - PROJECTS_SERVICE_URL=http://projects-service:3008
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
            - CORS_ORIGINS=${CORS_ORIGINS}
            - PROXY_TIMEOUT_MS=${PROXY_TIMEOUT_MS:-30000}
        env_file:
            - .env
        depends_on:
            rabbitmq:
                condition: service_healthy
            users-service:
                condition: service_started
            scraping-service:
                condition: service_started
            notifications-service:
                condition: service_started
            portfolio-service:
                condition: service_started
            cv-service:
                condition: service_started
            ai-service:
                condition: service_started
            jobs-service:
                condition: service_started
            projects-service:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
            interval: 15s
            timeout: 5s
            retries: 8

    users-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: users-service
        ports:
            - "3001:3001"
        environment:
            - PORT=3001
            - PORT_USERS_SERVICE=3001
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
            interval: 15s
            timeout: 5s
            retries: 8

    notifications-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: notifications-service
        ports:
            - "3003:3003"
        environment:
            - PORT=3003
            - PORT_NOTIFICATIONS_SERVICE=3003
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - PROJECTS_SERVICE_URL=http://projects-service:3008
            - USERS_SERVICE_URL=http://users-service:3001
            - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mock}
            - EMAIL_FROM=${EMAIL_FROM:-no-reply@glybette.dev}
            - RESEND_API_KEY=${RESEND_API_KEY:-}
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            rabbitmq:
                condition: service_healthy
            projects-service:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
            interval: 15s
            timeout: 5s
            retries: 8

    portfolio-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: portfolio-service
        ports:
            - "3004:3004"
        environment:
            - PORT=3004
            - PORT_PORTFOLIO_SERVICE=3004
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - PORTFOLIO_PUBLIC_ROOT_DOMAIN=${PORTFOLIO_PUBLIC_ROOT_DOMAIN}
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - USERS_SERVICE_URL=http://users-service:3001
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            rabbitmq:
                condition: service_healthy
            users-service:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
            interval: 15s
            timeout: 5s
            retries: 8

    projects-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: projects-service
        ports:
            - "3008:3008"
        environment:
            - PORT=3008
            - PORT_PROJECTS_SERVICE=3008
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - PROJECTS_SERVICE_MONGODB_DB_NAME=glybette_projects
            - UPLOAD_PROVIDER=${UPLOAD_PROVIDER:-disk}
            - PROJECTS_UPLOAD_DISK_DIR=/app/.data/projects-uploads
            - PROJECTS_UPLOAD_PUBLIC_BASE_URL=/api/projects/media
            - PROJECTS_UPLOAD_MAX_MB=5
            - PROJECTS_UPLOAD_S3_BUCKET=${PROJECTS_UPLOAD_S3_BUCKET:-}
            - PROJECTS_UPLOAD_S3_REGION=${PROJECTS_UPLOAD_S3_REGION:-}
            - PROJECTS_UPLOAD_S3_PREFIX=${PROJECTS_UPLOAD_S3_PREFIX:-projects/covers}
            - PROJECTS_UPLOAD_S3_ENDPOINT=${PROJECTS_UPLOAD_S3_ENDPOINT:-}
            - PROJECTS_UPLOAD_S3_FORCE_PATH_STYLE=${PROJECTS_UPLOAD_S3_FORCE_PATH_STYLE:-false}
            - PROJECTS_UPLOAD_S3_ACCESS_KEY_ID=${PROJECTS_UPLOAD_S3_ACCESS_KEY_ID:-}
            - PROJECTS_UPLOAD_S3_SECRET_ACCESS_KEY=${PROJECTS_UPLOAD_S3_SECRET_ACCESS_KEY:-}
            - PROJECTS_UPLOAD_S3_PUBLIC_BASE_URL=${PROJECTS_UPLOAD_S3_PUBLIC_BASE_URL:-}
            - USERS_SERVICE_URL=http://users-service:3001
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - INTEROP_SYNC_TIMEOUT_MS=7000
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        volumes:
            - projects_uploads:/app/.data/projects-uploads
        depends_on:
            rabbitmq:
                condition: service_healthy
            users-service:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
            interval: 15s
            timeout: 5s
            retries: 8

    scraping-service:
        build:
            context: .
            dockerfile: apps/scraping-service/Dockerfile
        ports:
            - "3002:3002"
        environment:
            - PORT=3002
            - PORT_SCRAPING_SERVICE=3002
            - NODE_ENV=production
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - MONGODB_URI=${MONGODB_URI}
            - SCRAPING_MONGODB_NAME=${SCRAPING_MONGODB_NAME}
            - SCRAPE_DELAY_MIN=${SCRAPE_DELAY_MIN}
            - SCRAPE_DELAY_MAX=${SCRAPE_DELAY_MAX}
            - SCHEDULE_INDEED=${SCHEDULE_INDEED}
            - SCHEDULE_WTTJ=${SCHEDULE_WTTJ}
            - SCHEDULE_LINKEDIN=${SCHEDULE_LINKEDIN}
            - SCHEDULE_PFEBOOKS=${SCHEDULE_PFEBOOKS}
            - ARCHIVE_AFTER_DAYS=${ARCHIVE_AFTER_DAYS}
            - SCRAPING_LOG_LEVEL=${SCRAPING_LOG_LEVEL}
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        depends_on:
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:3002/health').status==200 else 1)" ]
            interval: 20s
            timeout: 5s
            retries: 8

    ai-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: ai-service
        ports:
            - "3007:3007"
        environment:
            - PORT=3007
            - PORT_AI_SERVICE=3007
            - NODE_ENV=production
            - AI_PROVIDER=${AI_PROVIDER}
            - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
            - OLLAMA_MODEL=${OLLAMA_MODEL}
            - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            - GEMINI_API_KEY=${GEMINI_API_KEY}
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
        env_file:
            - .env
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
            interval: 20s
            timeout: 5s
            retries: 8

    cv-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: cv-service
        ports:
            - "3006:3006"
        environment:
            - PORT=3006
            - PORT_CV_SERVICE=3006
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - AI_SERVICE_URL=http://ai-service:3007
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
        env_file:
            - .env
        depends_on:
            ai-service:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
            interval: 15s
            timeout: 5s
            retries: 8

    jobs-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: jobs-service
        ports:
            - "3005:3005"
        environment:
            - PORT=3005
            - PORT_JOBS_SERVICE=3005
            - NODE_ENV=production
            - MONGODB_URI=${MONGODB_URI}
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - AI_SERVICE_URL=http://ai-service:3007
            - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            - USERS_SERVICE_URL=http://users-service:3001
        env_file:
            - .env
        depends_on:
            rabbitmq:
                condition: service_healthy
            ai-service:
                condition: service_started
            users-service:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
            interval: 15s
            timeout: 5s
            retries: 8

volumes:
    redis_data:
    projects_uploads:
